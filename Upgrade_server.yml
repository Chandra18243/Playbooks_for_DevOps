---
- name: Pre-upgrade capture, upgrade, and post-upgrade validation
  hosts: all
  become: yes

  vars:
    log_dir: /tmp/upgrade_logs
    pre_log: "{{ log_dir }}/{{ inventory_hostname }}_pre_upgrade_report.txt"
    post_log: "{{ log_dir }}/{{ inventory_hostname }}_post_upgrade_report.txt"
    target_kernel: "5.14.0-503.35.1.el9_5.x86_64"

  tasks:

    - name: Create log directory on control node
      file:
        path: "{{ log_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Capture current kernel
      command: uname -r
      register: pre_kernel

    - name: Capture running services
      shell: systemctl list-units --type=service --state=running --no-legend | awk '{print $1}'
      register: running_services

    - name: Capture CPU info
      command: lscpu
      register: cpu_info

    - name: Capture disk usage
      command: df -h
      register: disk_usage

    - name: Capture block devices
      command: lsblk
      register: block_info

    - name: Save pre-upgrade report
      copy:
        dest: "{{ pre_log }}"
        mode: '0644'
        content: |
          Hostname: {{ inventory_hostname }}

          === Kernel ===
          {{ pre_kernel.stdout }}

          === Running Services ===
          {{ running_services.stdout }}

          === CPU Info ===
          {{ cpu_info.stdout }}

          === Disk Usage ===
          {{ disk_usage.stdout }}

          === Block Devices ===
          {{ block_info.stdout }}
      delegate_to: localhost

    - name: Switch to intervention target
      command: systemctl isolate intervention.target
      ignore_errors: yes

    - name: Upgrade all packages
      yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Regenerate initramfs
      command: dracut -f

    - name: Set default boot target
      command: systemctl set-default multi-user.target

    - name: Reboot server
      reboot:
        reboot_timeout: 600

    - name: Get running kernel after reboot
      command: uname -r
      register: post_kernel

    - name: Capture running services after upgrade
      shell: systemctl list-units --type=service --state=running --no-legend | awk '{print $1}'
      register: running_services_post

    - name: Capture CPU info after upgrade
      command: lscpu
      register: cpu_info_post

    - name: Capture disk usage after upgrade
      command: df -h
      register: disk_usage_post

    - name: Capture block devices after upgrade
      command: lsblk
      register: block_info_post

    - name: Save post-upgrade report
      copy:
        dest: "{{ post_log }}"
        mode: '0644'
        content: |
          Hostname: {{ inventory_hostname }}

          === Target Kernel ===
          {{ target_kernel }}

          === Running Kernel ===
          {{ post_kernel.stdout }}

          === Running Services ===
          {{ running_services_post.stdout }}

          === CPU Info ===
          {{ cpu_info_post.stdout }}

          === Disk Usage ===
          {{ disk_usage_post.stdout }}

          === Block Devices ===
          {{ block_info_post.stdout }}
      delegate_to: localhost

    - name: Validate kernel version
      fail:
        msg: >
          Target kernel does not match the running kernel after upgrade.
          Expected: {{ target_kernel }}
          Running: {{ post_kernel.stdout }}

          Please check the server manually.
      when: target_kernel != post_kernel.stdout

    - name: Upgrade successful
      debug:
        msg: >
          SUCCESS: Server upgraded successfully to the latest kernel.
          Running kernel: {{ post_kernel.stdout }}
      when: target_kernel == post_kernel.stdout
